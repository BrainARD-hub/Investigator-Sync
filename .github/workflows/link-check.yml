name: Link Checker

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check URLs
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --accept 200,204,206,301,302,400,403,429,500,999
            --timeout 20
            --retry-wait-time 5
            --max-retries 2
            --exclude-mail
            tools.json
            README.md
            index.html
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
